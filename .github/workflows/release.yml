name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    # The local-AI fork is installed from Git; never publish over upstream's npm name.
    if: github.repository == 'nicobailon/pi-subagents'
    runs-on: ubuntu-latest
    # Waits for the maintainer's approval on GitHub before anything is published.
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install devDependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: npm run test:all
      - name: Build published package
        run: npm run build:pkg
      - name: Publish to npm
        run: npm publish ./dist-pkg --provenance
